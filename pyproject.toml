[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-runtime"
version = "0.1.0"
description = "Git for Autonomous AI Actions: record, replay, fork, diff, undo."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=42.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100", "ruff>=0.4", "mypy>=1.10"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=1.0"]

[project.scripts]
aether = "aether.cli.main:app"

[tool.setuptools.packages.find]
include = ["aether*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# B008 flags `typer.Option(...)` in argument defaults, which is the
# documented, correct way to use Typer — not a real bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
